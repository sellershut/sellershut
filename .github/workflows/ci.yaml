permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: ci

env:
  DATABASE_URL: postgres://postgres:password@localhost:5432/sellershut

jobs:
  biome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload sarif results
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          version: ^11.21.0
          cache: true
          cache-dependency-path: sellershut/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: sellershut
        run: pnpm install --frozen-lockfile
      - name: Run Biome
        working-directory: sellershut
        run: |
          pnpm exec biome ci \
            --reporter=sarif \
            --reporter-file=biome-results.sarif \
            .
        continue-on-error: true
      - name: Upload Biome results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sellershut/biome-results.sarif
          category: biome
          wait-for-processing: true

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload sarif results
    name: beta / clippy
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: beta
          components: clippy,rustfmt
      - name: Start stack
        run: docker compose up -d
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: |
            clippy-sarif
            sarif-fmt
            sqlx-cli
      - run: cargo sqlx migrate run
      - name: Run rust-clippy
        run:
          cargo clippy
          --workspace
          --all-features
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true
      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          category: clippy
          wait-for-processing: true
      - &stop-stack
        name: Stop stack
        if: always()
        run: |
          docker compose down -v
          docker stop $(docker ps -aq) || true
          docker rm $(docker ps -aq) || true

  fmt:
    runs-on: ubuntu-latest
    name: stable / fmt
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  os-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - &install-nextest
        name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-nextest
      - name: cargo test --workspace
        run: cargo nextest run --no-run --workspace --locked --all-features --all-targets
      - name: cargo build
        run: cargo build --workspace --locked --all-features --all-targets

  msrv:
    name: msrv / ${{ matrix.msrv }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        msrv: ["1.91.0"]
    steps:
      - uses: actions/checkout@v7
      - name: Install ${{ matrix.msrv }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.msrv }}
      - name: Start stack
        run: docker compose up -d
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: |
            sqlx-cli
      - run: cargo sqlx migrate run
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-hack
      - name: cargo hack +${{ matrix.msrv }} 
        run: cargo hack --clean-per-run --feature-powerset check
      - *stop-stack

  test:
    name: test / workspace
    runs-on: ubuntu-latest
    needs:
      - os-check
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Start stack
        run: docker compose up -d
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: |
            sqlx-cli
      - run: cargo sqlx migrate run
      - *install-nextest
      - name: Check .sqlx
        run: cargo sqlx prepare --check --workspace
      - name: Install build dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Create junit.xml (nextest)
        run: |
          mkdir -p .config
          echo '[profile.ci.junit]' > .config/nextest.toml
          echo 'path = "junit.xml"' >> .config/nextest.toml
      - name: cargo llvm-cov
        run: cargo llvm-cov nextest --profile ci --workspace --locked --all-features --lcov --output-path lcov.info -- --include-ignored
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          flags: backend
      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          fail_ci_if_error: true
          files: ./target/nextest/ci/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - *stop-stack

  book:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/book
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: |
            mdbook
            mdbook-mermaid
      - run: mdbook build
      - run: mdbook test
